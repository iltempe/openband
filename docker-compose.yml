# docker compose up -d   → http://<this machine>:8080
services:
  openband:
    image: ghcr.io/iltempe/openband:latest
    build: .
    ports:
      - "8080:7777"
    environment:
      # Multiplayer rooms "on this network" (relay and signaling in the same container).
      OPENBAND_COLLAB: "1"
      # claude.ai connector at https://<host>/mcp (see the README, "From claude.ai"): set a long random token.
      # OPENBAND_REMOTE_MCP: "1"
      # OPENBAND_REMOTE_TOKEN: "change-me"
      # Instance settings (name, language, features…): see config.example.json.
      # OPENBAND_CONFIG: /config/config.json
    # volumes:
    #   - ./config.json:/config/config.json:ro
    restart: unless-stopped
