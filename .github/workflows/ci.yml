name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  song-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/openband-lint
        with:
          files: src/__fixtures__/demo.v1.json

  # The npm package as a user gets it: pack → install in an empty folder → MCP over stdio + studio over HTTP.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-pack.mjs

  # The Claude Desktop extension: build the .mcpb with the official tool and run its server as Claude Desktop does.
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-mcpb.mjs
      - run: node scripts/smoke-mcpb.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: openband-mcpb
          path: build/*.mcpb

  # The built studio in a real Chrome: first run (< 3 s to music, tour) and the offline PWA.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/e2e/run.mjs

  # What a release would produce, without publishing: npm tarball and .mcpb at the same version, notes present.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release-dry-run.mjs

  # The self-hosting image: build, run, and check it serves the studio, its version and the CSP.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openband:ci .
      - run: docker run -d --name ob -p 8080:7777 openband:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/version.json && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/version.json | grep -q '"app":"openband"'
          curl -sf http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          test "$(docker inspect --format '{{.State.Health.Status}}' ob)" != unhealthy
