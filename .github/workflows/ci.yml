name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # The plugin host and its test fixtures, for server/plughost.test.ts.
      - run: node scripts/build-plughost.mjs
      - run: npm test

  # The Open Music Engine Profile: the reference mock engine passes the conformance suite.
  omep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run omep:conformance
      # E6: an engine made from omep-template passes conformance as it comes.
      - run: npm run omep:template
      # Streaming engines (stream.jam): the mock behind a jittery network.
      - run: node omep/conformance.mjs -- node omep/mock-stream-engine.mjs --latency 30 --jitter 40

  song-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/openband-lint
        with:
          files: src/__fixtures__/demo.v1.json

  # The npm package as a user gets it: pack → install in an empty folder → MCP over stdio + studio over HTTP.
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node scripts/smoke-pack.mjs

  # The Claude Desktop extension: build the .mcpb with the official tool and run its server as Claude Desktop does.
  mcpb:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/build-mcpb.mjs
      - run: node scripts/smoke-mcpb.mjs
      - uses: actions/upload-artifact@v4
        if: matrix.os == 'ubuntu-latest'
        with:
          name: openband-mcpb
          path: build/*.mcpb

  # The desktop app (Electron), unpacked, on the three systems: it starts and plays, and an MCP client
  # launching its executable opens it and drives it (scripts/smoke-desktop.mjs).
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgbm1 libasound2t64 || sudo apt-get install -y xvfb libgbm1 libasound2)
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      # The native plugin host (G8), both architectures (macOS: one universal binary).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: node scripts/build-plughost.mjs
      - if: runner.os != 'macOS'
        run: node scripts/build-plughost.mjs --arch ${{ runner.arch == 'ARM64' && 'x64' || 'arm64' }}
      # Both architectures, as the release does (the second build once failed on a reused config).
      - run: node scripts/build-desktop.mjs --dir
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs
      - if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs

  # The built studio in a real Chrome: first run (< 3 s to music, tour) and the offline PWA.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # ffprobe / ffmpeg check the release video (e2e "video").
      - run: command -v ffprobe || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - run: node scripts/e2e/run.mjs

  # What a release would produce, without publishing: npm tarball and .mcpb at the same version, notes present.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/release-dry-run.mjs

  # The self-hosting image: build, run, and check it serves the studio, its version and the CSP.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t openband:ci .
      - run: docker run -d --name ob -p 8080:7777 openband:ci
      - name: Smoke test
        run: |
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/version.json && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/version.json | grep -q '"app":"openband"'
          curl -sf http://127.0.0.1:8080/ | grep -q 'id="root"'
          curl -sI http://127.0.0.1:8080/ | grep -qi '^content-security-policy:'
          test "$(docker inspect --format '{{.State.Health.Status}}' ob)" != unhealthy
