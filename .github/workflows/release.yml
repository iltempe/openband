name: Release

# Push a tag vX.Y.Z (matching package.json) to publish at the same version: a GitHub Release with the
# built package (openband.tgz — what `npx -y <release url>` runs) and the Claude Desktop extension
# (openband.mcpb), the desktop app for macOS, Windows and Linux (unsigned), and notes from the CHANGELOG. The online demo deploys from main (pages.yml): the
# github-pages environment only accepts main, and the release commit is already there.
# Opt-in (repository variables): NPM_PUBLISH=true publishes to npm (needs NPM_TOKEN and a package name
# OpenBand owns — "openband" is not), PUBLISH_DOCKER=true pushes the image to GHCR.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  pages: write
  packages: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm run typecheck
      - run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run build
      - run: node scripts/smoke-pack.mjs
      - if: vars.NPM_PUBLISH == 'true'
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: node scripts/build-mcpb.mjs && node scripts/smoke-mcpb.mjs
      # The built package (build/openband-X.Y.Z.tgz), the one `npx -y --allow-remote=all <release>/openband.tgz` runs.
      - run: mkdir -p build && npm pack --pack-destination build && test -f "build/openband-${GITHUB_REF_NAME#v}.tgz"
      # Stable names too, for the "latest" links in the README.
      - run: cp "build/openband-${GITHUB_REF_NAME#v}.mcpb" build/openband.mcpb && cp "build/openband-${GITHUB_REF_NAME#v}.tgz" build/openband.tgz
      - run: node scripts/release-notes.mjs "${GITHUB_REF_NAME}" > build/notes.md
      - run: gh release create "${GITHUB_REF_NAME}" build/*.mcpb build/*.tgz --title "OpenBand ${GITHUB_REF_NAME}" --notes-file build/notes.md
        env:
          GH_TOKEN: ${{ github.token }}

  # The self-hosting image on GHCR, for amd64 and arm64 (NAS, Raspberry Pi).
  docker:
    needs: verify
    if: vars.PUBLISH_DOCKER == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:latest

  # The desktop app: installers for each system, added to the release created above. Unsigned unless the
  # signing secrets exist (CSC_LINK / CSC_KEY_PASSWORD for macOS and Windows: see docs/DESKTOP.md).
  desktop:
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json
      - if: runner.os == 'Linux'
        run: sudo apt-get update && (sudo apt-get install -y xvfb libgbm1 libasound2t64 || sudo apt-get install -y xvfb libgbm1 libasound2)
      - run: npm ci
      - run: npm ci --prefix desktop
      - run: npm run build
      # The native plugin host (G8), both architectures (macOS: one universal binary).
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - run: node scripts/build-plughost.mjs
      - if: runner.os != 'macOS'
        run: node scripts/build-plughost.mjs --arch ${{ runner.arch == 'ARM64' && 'x64' || 'arm64' }}
      - run: node scripts/build-desktop.mjs
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # The unpacked app of this machine's architecture, tested before anything is uploaded.
      - if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-desktop.mjs
      - if: runner.os != 'Linux'
        run: node scripts/smoke-desktop.mjs
      # Each file also without its version (OpenBand-mac-arm64.dmg…), for the README's "latest" links.
      - shell: bash
        run: |
          cd build/desktop
          # Each system makes only some of these: patterns that match nothing just vanish.
          shopt -s nullglob
          files=(*.dmg *.zip *.exe *.AppImage *.deb)
          test ${#files[@]} -gt 0
          stable=()
          for f in "${files[@]}"; do cp "$f" "${f/-${GITHUB_REF_NAME#v}/}"; stable+=("${f/-${GITHUB_REF_NAME#v}/}"); done
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" "${stable[@]}" --clobber
        env:
          GH_TOKEN: ${{ github.token }}

  # The Flatpak (issue #5): built from the .deb files just uploaded, with the same manifest a Flathub
  # submission carries (scripts/flatpak-manifest.mjs), and attached as a bundle anyone can install.
  flatpak:
    needs: desktop
    runs-on: ubuntu-latest
    container:
      image: bilelmoussaoui/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/flatpak-manifest.mjs "${GITHUB_REF_NAME}" --out build/flatpak
        env:
          GH_TOKEN: ${{ github.token }}
      # Flathub's own linter on the manifest, before a submission (it doesn't stop the release).
      - continue-on-error: true
        run: |
          flatpak remote-add --if-not-exists --user flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install -y --user flathub org.flatpak.Builder
          flatpak run --command=flatpak-builder-lint org.flatpak.Builder manifest build/flatpak/it.openband.OpenBand.yml
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: build/flatpak/it.openband.OpenBand.yml
          bundle: OpenBand-linux-x86_64.flatpak
          cache-key: flatpak-builder-${{ github.ref_name }}
          upload-artifact: true
  flatpak-upload:
    needs: flatpak
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*flatpak*'
          merge-multiple: true
      - shell: bash
        run: |
          f=$(ls *.flatpak | head -1)
          cp "$f" "OpenBand-${GITHUB_REF_NAME#v}-linux-x86_64.flatpak"
          [ "$f" = OpenBand-linux-x86_64.flatpak ] || cp "$f" OpenBand-linux-x86_64.flatpak
          gh release upload "${GITHUB_REF_NAME}" "OpenBand-${GITHUB_REF_NAME#v}-linux-x86_64.flatpak" OpenBand-linux-x86_64.flatpak --clobber --repo "${GITHUB_REPOSITORY}"
        env:
          GH_TOKEN: ${{ github.token }}
