name: Deploy the studio and the website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the release workflow, so the demo matches the published version.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Forks don't deploy unless they opt in (Settings → Variables → OPENBAND_DEPLOY = true).
    if: github.event.repository.fork == false || vars.OPENBAND_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The website: build/site (for www.openband.it) and the old address next to the studio, /openband/about/.
      - run: node scripts/build-site.mjs
      # www.openband.it is served by iltempe/openband-site: publish build/site there (deploy key with write
      # access to that repository only). Forks without the secret skip it.
      - name: Publish the website to iltempe/openband-site
        if: github.repository == 'iltempe/openband'
        env:
          SITE_DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          [ -n "$SITE_DEPLOY_KEY" ] || { echo "No SITE_DEPLOY_KEY: the website is not published."; exit 0; }
          mkdir -p ~/.ssh && printf '%s\n' "$SITE_DEPLOY_KEY" > ~/.ssh/site && chmod 600 ~/.ssh/site
          export GIT_SSH_COMMAND="ssh -i $HOME/.ssh/site -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone -q --depth 1 git@github.com:iltempe/openband-site.git "$RUNNER_TEMP/site"
          rsync -a --delete --exclude .git --exclude README.md build/site/ "$RUNNER_TEMP/site/"
          cd "$RUNNER_TEMP/site"
          git add -A
          if git diff --cached --quiet; then echo "The website is unchanged."; exit 0; fi
          git -c user.name="openband-pages" -c user.email="openband@users.noreply.github.com" commit -q -m "Website from iltempe/openband@${GITHUB_SHA::7}"
          git push -q origin main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
