name: Deploy the studio and the website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Called by the release workflow, so the demo matches the published version.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Forks don't deploy unless they opt in (Settings → Variables → OPENBAND_DEPLOY = true).
    if: github.event.repository.fork == false || vars.OPENBAND_DEPLOY == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # The website, next to the studio: /openband/about/
      - run: node scripts/build-site.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
