name: Feature request
description: An idea for OpenBand
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like OpenBand to do?
      description: The music you are making and where OpenBand gets in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: In another DAW, with a plugin, by hand…
  - type: checkboxes
    id: ai
    attributes:
      label: AI
      options:
        - label: It should also be available to the AI (an MCP tool)
