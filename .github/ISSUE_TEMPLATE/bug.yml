name: Bug report
description: Something doesn't work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open the demo\n2. …"
  - type: dropdown
    id: where
    attributes:
      label: Where were you using OpenBand?
      options:
        - Online demo
        - npx openband
        - Claude Desktop extension (.mcpb)
        - Installed app (PWA)
        - From a checkout (npm run dev)
        - Self-hosted instance
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Filled in by ⋯ → Diagnostics → Report a problem (no song data, no keys). Or paste the output of `npx openband doctor`.
